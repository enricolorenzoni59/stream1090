name: binary-size

# Measure the stream1090 backend matrix (binary size, peak compiler RSS,
# ctest results, warnings, wall-time) for every toolchain. This workflow only
# measures and uploads artifacts; the PR comment is assembled by the separate
# binary-size-report workflow, triggered by workflow_run, so it runs with the
# full token of the target repo even when this workflow runs from a fork pull
# request (a fork PR gets a read-only token and could never post the comment
# itself).
#
# "Airspy only" / "RTL-SDR only" hide the other backend from pkg-config (a
# shadow copy of both .pc directories without the file to hide), because every
# library is installed on the runner regardless.
on:
  pull_request:

permissions:
  # contents: read suffices for measuring; the post-comment job needs
  # issues: write / pull-requests: write to post or update the PR comment.
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: binary-size-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: ubuntu-gcc,    cc: gcc,     cxx: g++,      label: "GNU gcc / Ubuntu x64" }
          - { os: ubuntu-latest, name: ubuntu-clang,  cc: clang,   cxx: clang++,   label: "LLVM clang / Ubuntu x64" }
          - { os: macos-14,      name: macos-clang,   cc: clang,   cxx: clang++,   label: "Apple clang / macOS x64" }
          - { os: macos-15,      name: macos-arm,     cc: clang,   cxx: clang++,   label: "Apple clang / macOS arm64" }
          - { os: macos-14,      name: macos-gcc,     cc: gcc,     cxx: g++,       label: "GNU gcc / macOS x64 (Homebrew)" }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      MATRIX_LABEL: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libusb-1.0-0-dev \
            libairspy-dev librtlsdr-dev

      - name: Install dependencies (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install --quiet cmake pkg-config librtlsdr airspy gcc

      - name: Prepare pkg-config shadow directories
        run: |
          RTL_PCDIR="$(pkg-config --variable=pcfiledir librtlsdr)"
          AIR_PCDIR="$(pkg-config --variable=pcfiledir libairspy)"
          for d in pc-rtl pc-air pc-none; do rm -rf "$d"; mkdir -p "$d"; done
          for d in pc-rtl pc-air; do
            for f in "$RTL_PCDIR"/*.pc "$AIR_PCDIR"/*.pc; do cp "$f" "$d"; done
          done
          rm -f pc-air/librtlsdr.pc
          rm -f pc-rtl/libairspy.pc

      - name: Build and measure all four configurations
        # Peak RSS per configuration: each config is built in a forked child so
        # its ru_maxrss measures only that build, not an accumulated maximum.
        # The RS build is stream1090 alone with -j1; that is where main.cpp.o
        # (the TU instantiating every preset) compiles. ru_maxrss is in KB on
        # Linux and in bytes on macOS, hence the OS-aware conversion.
        run: |
          python3 - <<'EOF'
          import json, multiprocessing, os, re, resource, subprocess, sys, time

          ctx = multiprocessing.get_context("fork")
          root = os.environ["GITHUB_WORKSPACE"]
          compiler = os.environ["CXX"]
          platform = os.environ.get("MATRIX_LABEL", os.environ.get("RUNNER_OS", "?"))

          def measure(cfg):
              build_dir = os.path.join(root, "build-" + cfg["name"])
              env = dict(os.environ)
              if cfg["pkg"] is None:
                  env.pop("PKG_CONFIG_LIBDIR", None)
              else:
                  env["PKG_CONFIG_LIBDIR"] = cfg["pkg"]
              r = {
                  "compiler": compiler,
                  "platform": platform,
                  "config": cfg["label"],
                  "size_bytes": None, "peak_rss_kb": None,
                  "tests": None, "warnings": None, "build_time_s": None,
                  "built": True, "error": None,
              }
              t0 = time.monotonic()
              try:
                  subprocess.run(
                      ["cmake", "-S", ".", "-B", build_dir,
                       "-DCMAKE_BUILD_TYPE=Release", "-DBUILD_TESTING=ON"],
                      env=env, check=True, cwd=root)
                  subprocess.run(
                      ["cmake", "--build", build_dir, "--parallel", "1",
                       "--target", "stream1090"],
                      env=env, check=True, cwd=root)
                  r["peak_rss_kb"] = resource.getrusage(resource.RUSAGE_CHILDREN).ru_maxrss
                  if sys.platform == "darwin":
                      r["peak_rss_kb"] //= 1024
                  r["size_bytes"] = os.path.getsize(os.path.join(build_dir, "stream1090"))
                  b = subprocess.run(
                      ["cmake", "--build", build_dir, "--parallel", "2"],
                      env=env, capture_output=True, text=True, cwd=root, check=True)
                  r["warnings"] = len(re.findall(r": warning:", b.stdout + b.stderr))
                  r["build_time_s"] = round(time.monotonic() - t0, 1)
                  tp = subprocess.run(["ctest", "--test-dir", build_dir,
                                       "--output-on-failure"],
                                      env=env, capture_output=True, text=True, cwd=root)
                  m = re.search(r"(\d+)% tests passed, (\d+) tests failed out of (\d+)",
                                tp.stdout)
                  r["tests"] = {"passed": bool(tp.returncode == 0)}
                  if m:
                      total = int(m.group(3))
                      failed = int(m.group(2))
                      r["tests"].update(passed_n=total - failed,
                                        failed_n=failed,
                                        total_n=total)
              except subprocess.CalledProcessError as e:
                  r["built"] = False
                  r["error"] = str(e)
              return r

          configs = [
              {"name": "both", "label": "Airspy + RTL-SDR", "pkg": None},
              {"name": "air",  "label": "Airspy only",      "pkg": os.path.join(root, "pc-air")},
              {"name": "rtl",  "label": "RTL-SDR only",     "pkg": os.path.join(root, "pc-rtl")},
              {"name": "none", "label": "Neither",          "pkg": os.path.join(root, "pc-none")},
          ]
          # Per-config RSS: run each build in a separate forked child so its
          # ru_maxrss measures only that build, not the max across all four.
          rows = [None] * len(configs)
          for i, cfg in enumerate(configs):
              q = ctx.Queue()
              p = ctx.Process(target=lambda c=cfg, q=q: q.put(measure(c)))
              p.start()
              p.join()
              rows[i] = q.get()

          with open("sizes_%s.json" % compiler.replace("/", "_"), "w") as f:
              json.dump(rows, f)
          print("measured", len(rows), "configurations for", platform)
          EOF

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sizes-${{ matrix.name }}
          path: sizes_*.json

  post-comment:
    # Forks of the target repo run with a read-only token and cannot post
    # PR comments (403). On repos where the token has write access (this
    # fork during development, and the target repo once main merges this),
    # this job renders the table from the artifacts and upserts it.
    needs: [measure]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: sizes
          pattern: sizes-*
          merge-multiple: true

      - name: Render table
        id: render
        run: |
          python3 - <<'EOF'
          import glob, json, os, re, sys

          rows = []
          print("sizes tree:")
          for p in glob.glob("sizes/**/*", recursive=True):
              print("  ", p)
          for path in glob.glob("sizes/**/sizes_*.json", recursive=True):
              with open(path) as f:
                  rows.extend(json.load(f))
          if not rows:
              import pathlib
              for p in pathlib.Path("sizes").rglob("*"):
                  print("  file:", p)
              sys.exit("no size artifacts found")
          expected = [
              "GNU gcc / Ubuntu x64",
              "LLVM clang / Ubuntu x64",
              "Apple clang / macOS x64",
              "Apple clang / macOS arm64",
              "GNU gcc / macOS x64 (Homebrew)",
          ]
          configs = ["Airspy + RTL-SDR", "Airspy only", "RTL-SDR only", "Neither"]
          grid = {}
          for r in rows:
              grid.setdefault(r["platform"], {})[r["config"]] = r
          rows = []
          for p in expected:
              for c in configs:
                  r = grid.get(p, {}).get(c)
                  if r is None:
                      r = {"platform": p, "config": c, "built": False,
                           "size_bytes": None, "peak_rss_kb": None,
                           "tests": None, "warnings": None,
                           "build_time_s": None, "error": "no artifact"}
                  rows.append(r)

          def kb(n):
              return "fail" if n is None else f"{n/1024:.0f} KB"
          def rss(n):
              return "fail" if n is None else f"{n/1024:.0f} MB"
          def tests(t):
              if t is None:
                  return "n/a"
              if "total_n" in t:
                  mark = "ok" if t["passed"] else "FAIL"
                  return f"{t['passed_n']}/{t['total_n']} ({mark})"
              return "ok" if t["passed"] else "FAIL"
          def secs(n):
              return "fail" if n is None else f"{n:.0f}s"

          lines = [
              "## stream1090 backend build matrix",
              "",
              f"Measured at `{os.environ['GITHUB_SHA'][:7]}` in a clean tree "
              "(`-DCMAKE_BUILD_TYPE=Release`). Peak RSS is the `stream1090` "
              "target with `-j1` (the `main.cpp` TU compiling every preset); "
              "tests are `ctest`; warnings are from the full build log.",
              "",
              "| Toolchain | Backends | Binary | Peak RSS | Tests | Warnings | Build time |",
              "|---|---|---|---|---|---|---|",
          ]
          for r in rows:
              lines.append(
                  f"| {r['platform']} | {r['config']} "
                  f"| {kb(r['size_bytes'])} | {rss(r['peak_rss_kb'])} "
                  f"| {tests(r['tests'])} | {r['warnings'] if r['warnings'] is not None else 'fail'} "
                  f"| {secs(r['build_time_s'])} |"
              )
          body = "\n".join(lines) + "\n"
          with open("comment.md", "w") as f:
              f.write(body)
          print(body, end="")
          bad = [r for r in rows if not r["built"] or (r["tests"] and not r["tests"]["passed"])]
          if bad:
              with open("failures.txt", "w") as f:
                  for b in bad:
                      f.write(f"{b['platform']} / {b['config']}: {b['error'] or 'tests failed'}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"failed={'true' if bad else 'false'}\n")
          EOF

      - name: Post comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("comment.md", "utf8");
            const marker = "<!-- stream1090-binary-size-table -->";
            const pr = context.payload.pull_request;
            if (!pr) { console.log("not a PR run; skip"); return; }
            const { owner, repo } = context.repo;
            const full = body + "\n" + marker;
            const list = await github.rest.issues.listComments({
              owner, repo, issue_number: pr.number, per_page: 100,
            });
            const existing = list.data.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body: full,
              });
              console.log("updated comment on PR " + pr.number);
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number, body: full,
              });
              console.log("created comment on PR " + pr.number);
            }

      - name: Verify all configurations built and tested
        if: steps.render.outputs.failed == 'true'
        run: |
          cat failures.txt
          exit 1