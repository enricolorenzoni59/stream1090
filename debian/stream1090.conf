# stream1090 service configuration
# Adjust STREAM1090_OPTS for your hardware and sample rate.
# With no --device, a feeder service (stdin is /dev/null) auto-detects an
# attached SDR: Airspy first, then RTL-SDR. Use --device stdin to read IQ from
# standard input instead, --device rtlsdr or --device airspy to force a backend,
# and --serial <id> to pick one specific unit.
# Examples:
#   STREAM1090_OPTS="--device auto -s 2.56 -u 12"
#   STREAM1090_OPTS="--device airspy -s 6"
#   STREAM1090_OPTS="--device rtlsdr --gain 40"
# Other useful flags: --agc, --bias-tee, --ppm <n>, --tuner-bandwidth <hz>.
STREAM1090_OPTS="--device auto -s 2.56 -u 12"

# TCP port that readsb/dump1090-fa is listening on for raw input.
READSB_PORT=30001
